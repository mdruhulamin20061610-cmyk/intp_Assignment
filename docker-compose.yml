services:
  drone_voice_control:
    build: .
    container_name: task1_drone
    # Gazebo/RViz/PyQt5 all need to open real windows on YOUR screen.
    # network_mode: host + the X11 socket mount below are what make a
    # container's GUI appear on the host's actual display, instead of
    # being invisible inside the container.
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - GAZEBO_MODEL_DATABASE_URI=
      - PULSE_SERVER=unix:/tmp/pulse_socket
      - PULSE_COOKIE=/root/.config/pulse/cookie
    volumes:
      # Share the X11 display socket so GUI windows render on your screen
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Share the host's already-running PulseAudio socket instead of
      # handing the container raw hardware access. The host's PulseAudio
      # daemon normally holds /dev/snd exclusively, so a container trying
      # to open it directly gets "Device or resource busy" -- routing
      # through the same server the host already uses avoids that fight.
      - ${XDG_RUNTIME_DIR}/pulse/native:/tmp/pulse_socket
      # PulseAudio authenticates clients with a cookie file, separately
      # from Linux file permissions on the socket above. Without sharing
      # this, the container connects as root (different from the socket's
      # owning user) and gets "Connection failure: Access denied" even
      # though the socket itself is reachable.
      - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie:ro
    group_add:
      - audio
    stdin_open: true
    tty: true
    command: bash
